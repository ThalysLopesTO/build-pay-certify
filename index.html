<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StackBuild - Construction Management</title>
    <meta name="description" content="Professional construction payroll and safety certification management system">
    <meta name="author" content="StackBuild" />

    <!-- Critical Resource Preloading for LCP -->
    <link rel="preload" href="/images/admin-login-bg.png" as="image" fetchpriority="high" />

    <!-- ✅ Google Maps Script with Places + Geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBgdO3avHHtY9d0TpYkxb22mcPGIPNWJvU&libraries=places,geometry"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#F97316" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StackBuild" />
    <meta name="application-name" content="StackBuild" />
    <meta name="msapplication-TileColor" content="#F97316" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-192x192.png" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />

    <meta property="og:title" content="Construction Payroll & Certification Manager" />
    <meta property="og:description" content="Professional construction payroll and safety certification management system" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/KZMIcc5ODRQW6WTOylpJO8fLKWi2/social-images/social-1757811717730-Stackk.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/KZMIcc5ODRQW6WTOylpJO8fLKWi2/social-images/social-1757811717730-Stackk.png">
    
    <!-- Force light theme on every load -->
    <script>
      (function() {
        try {
          // Always remove any dark mode class
          document.documentElement.classList.remove('dark');
          // Always save light mode in localStorage so components know
          localStorage.setItem('theme', 'light');
        } catch (e) {
          console.log('Theme initialization fallback to light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
